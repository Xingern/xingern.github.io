<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linnea & Xing</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/save-the-date.css">
</head>
<body>
    <section class="hero" id="home">
        <h2 class="title">留个念想</h2>
        <h1 class="names">林内亚 + 星星</h1>
        <p class="date">2026年5月30日</p>
        <div class="scroll-down" onclick="document.getElementById('video').scrollIntoView()"></div>
    </section>
    
    <section class="video-section" id="video">
        <h2 class="section-title">我们的历史</h2>
        <div class="video-container">
            <div class="video-placeholder">
                <video controls>
                    <source src="/media/bryllup/Save-The-Date.mp4" type="video/mp4">
                    Nettleseren din støtter ikke videoavspilling.
                </video>
            </div>
        </div>
    </section>
    
    <section class="details-section" id="details">
        <h2 class="section-title">婚礼细节</h2>
        <div class="details-container">
            <div class="detail-card">
                <div class="detail-icon">
                    <i class="far fa-calendar-alt"></i>
                </div>
                <h3 class="detail-title">什么时候</h3>
                <p class="detail-text">2026年5月30日<br></p>
            </div>
            
            <div class="detail-card">
                <div class="detail-icon">
                    <i class="fas fa-map-marker-alt"></i>
                </div>
                <h3 class="detail-title">在哪里</h3>
                <p class="detail-text">Rønningen selskapslokale<br>Baneveien 290<br>3410 Sylling<br>挪威</p>
            </div>
            <!--
            <div class="detail-card">
                <div class="detail-icon">
                    <i class="fas fa-glass-cheers"></i>
                </div>
                <h3 class="detail-title">Middag</h3>
                <p class="detail-text">Mottakelse følger<br>Middag & Dans<br>Formelt antrekk ønskes</p>
            </div>
        </div>
    </section>
    -->
    <footer>
        <p>我们期待与您一起庆祝</p>
        <p>如果您有任何疑问，请发送电子邮件至 <a href="mailto:xingdotmail@gmail.com">xingdotmail@gmail.com </a></p>
        <p>&copy; 2025 Linnea & Xing</p>
    </footer>
    
    <script>
        // Smooth scroll for internal links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });
    </script>
</body>
</html>
